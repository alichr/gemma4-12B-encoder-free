<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="Gemma 4 12B — Encoder-Free Multimodal Architecture">
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1212"/>
      <stop offset="0.55" stop-color="#0f1819"/>
      <stop offset="1" stop-color="#0a1011"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a9d8f"/>
      <stop offset="0.6" stop-color="#3fb6a3"/>
      <stop offset="1" stop-color="#e76f51"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#264653"/>
      <stop offset="1" stop-color="#2a9d8f"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="340" fill="url(#ink)"/>

  <!-- plot grid -->
  <g stroke="#19292a" stroke-width="1">
    <line x1="0" y1="68" x2="1280" y2="68"/>
    <line x1="0" y1="136" x2="1280" y2="136"/>
    <line x1="0" y1="204" x2="1280" y2="204"/>
    <line x1="0" y1="272" x2="1280" y2="272"/>
    <line x1="160" y1="0" x2="160" y2="340"/>
    <line x1="320" y1="0" x2="320" y2="340"/>
    <line x1="480" y1="0" x2="480" y2="340"/>
    <line x1="640" y1="0" x2="640" y2="340"/>
    <line x1="800" y1="0" x2="800" y2="340"/>
    <line x1="960" y1="0" x2="960" y2="340"/>
    <line x1="1120" y1="0" x2="1120" y2="340"/>
  </g>

  <!-- top accent rule -->
  <rect x="72" y="62" width="220" height="3" fill="url(#accent)"/>

  <!-- eyebrow -->
  <text x="72" y="52" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="16" letter-spacing="6" fill="#6fb8ad">GOOGLE · GEMMA 4 · 12B-IT</text>

  <!-- title -->
  <text x="70" y="146" font-family="Georgia,'Times New Roman',serif" font-size="76" font-weight="700" fill="#f4efe6">Encoder-Free</text>
  <text x="70" y="218" font-family="Georgia,'Times New Roman',serif" font-size="76" font-style="italic" font-weight="700" fill="#e76f51">Multimodal Architecture</text>

  <!-- subtitle -->
  <text x="72" y="262" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="17" letter-spacing="1" fill="#9fb3b0">no vision encoder · no audio encoder · raw patches &amp; waveforms → one 48-layer LLM</text>

  <!-- stat chips -->
  <g font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">
    <text x="72"  y="306" font-size="14" fill="#5f7a77">PARAMS</text>
    <text x="72"  y="326" font-size="20" fill="#2a9d8f">11.96B</text>
    <text x="220" y="306" font-size="14" fill="#5f7a77">VISION PATH</text>
    <text x="220" y="326" font-size="20" fill="#e76f51">49.9M</text>
    <text x="380" y="306" font-size="14" fill="#5f7a77">AUDIO PATH</text>
    <text x="380" y="326" font-size="20" fill="#e9c46a">2.46M</text>
    <text x="520" y="306" font-size="14" fill="#5f7a77">CONTEXT</text>
    <text x="520" y="326" font-size="20" fill="#f4efe6">256K</text>
  </g>

  <!-- spectrograph / per-layer norm motif (right) -->
  <g>
    <!-- 48 bars echoing the per-layer activation-norm trace -->
    <g fill="url(#bar)" opacity="0.92">
      <rect x="852"  y="190" width="7" height="70"/>
      <rect x="861"  y="214" width="7" height="46"/>
      <rect x="870"  y="222" width="7" height="38"/>
      <rect x="879"  y="216" width="7" height="44"/>
      <rect x="888"  y="206" width="7" height="54"/>
      <rect x="897"  y="210" width="7" height="50"/>
      <rect x="906"  y="214" width="7" height="46"/>
      <rect x="915"  y="232" width="7" height="28"/>
      <rect x="924"  y="240" width="7" height="20"/>
      <rect x="933"  y="244" width="7" height="16"/>
      <rect x="942"  y="232" width="7" height="28"/>
      <rect x="951"  y="200" width="7" height="60"/>
      <rect x="960"  y="168" width="7" height="92"/>
      <rect x="969"  y="140" width="7" height="120"/>
      <rect x="978"  y="120" width="7" height="140"/>
      <rect x="987"  y="98"  width="7" height="162"/>
      <rect x="996"  y="78"  width="7" height="182"/>
      <rect x="1005" y="96"  width="7" height="164"/>
      <rect x="1014" y="84"  width="7" height="176"/>
      <rect x="1023" y="70"  width="7" height="190"/>
      <rect x="1032" y="62"  width="7" height="198"/>
      <rect x="1041" y="78"  width="7" height="182"/>
      <rect x="1050" y="104" width="7" height="156"/>
      <rect x="1059" y="140" width="7" height="120"/>
      <rect x="1068" y="176" width="7" height="84"/>
      <rect x="1077" y="196" width="7" height="64"/>
    </g>
    <!-- accent peak markers -->
    <g fill="#e76f51">
      <rect x="1032" y="50" width="7" height="8"/>
      <rect x="996"  y="66" width="7" height="8"/>
    </g>
    <text x="852" y="282" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="12" letter-spacing="2" fill="#5f7a77">PER-LAYER ACTIVATION NORM · L0 → L48</text>
  </g>
</svg>
